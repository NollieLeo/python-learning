[project]
name = "python-learning"
version = "0.1.0"
description = "前端工程师学 Python 的课程仓库"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["lesson01", "lesson02"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# E/F 基础错误，I 是 import 排序（替代 isort），UP 自动升级到新语法，B 常见 bug
select = ["E", "F", "I", "UP", "B"]
